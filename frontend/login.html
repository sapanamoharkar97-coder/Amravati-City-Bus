<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Amravati City Bus Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/forms.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary-navy text-white text-center py-4">
                        <i class="fas fa-bus-alt fa-3x text-teal mb-2"></i>
                        <h4 class="fw-bold mb-0">City Bus Portal</h4>
                        <small class="text-light opacity-75">Amravati Municipal Transport System</small>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                                    <input type="text" class="form-control" id="username" placeholder="e.g. admin or rahul_sharma" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                                </div>
                            </div>

                            <button type="submit" id="btnLogin" class="btn btn-primary-navy w-100 py-2 fs-6 fw-bold">
                                <i class="fas fa-sign-in-alt me-2"></i> Sign In
                            </button>
                        </form>

                        <!-- Academic Quick Demo Logins -->
                        <div class="mt-4 pt-3 border-top text-center">
                            <small class="text-muted fw-bold d-block mb-2">QUICK TEST CREDENTIALS (DEMO):</small>
                            <div class="d-flex justify-content-center gap-2">
                                <button type="button" class="btn btn-sm btn-outline-primary" id="btnFillAdmin">
                                    <i class="fas fa-user-shield me-1"></i> Admin Demo
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-teal" id="btnFillPassenger">
                                    <i class="fas fa-user me-1"></i> Passenger Demo
                                </button>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <p class="text-muted small mb-0">
                                New passenger? <a href="register.html" class="text-teal fw-bold text-decoration-none">Create an Account</a>
                            </p>
                            <p class="text-muted small mt-1">
                                <a href="index.html" class="text-decoration-none">&larr; Return to Homepage</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect
            const user = getStoredUser();
            if (user) {
                window.location.href = user.role === 'admin' ? 'dashboard.html' : 'passenger_dashboard.html';
                return;
            }

            // Quick Demo Credential Autofill
            document.getElementById('btnFillAdmin').addEventListener('click', () => {
                document.getElementById('username').value = 'admin';
                document.getElementById('password').value = 'Admin@123';
            });

            document.getElementById('btnFillPassenger').addEventListener('click', () => {
                document.getElementById('username').value = 'rahul_sharma';
                document.getElementById('password').value = 'Passenger@123';
            });

            // Form Submit
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const alertEl = document.getElementById('loginAlert');
                alertEl.classList.add('d-none');

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const btn = document.getElementById('btnLogin');

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Authenticating...';

                try {
                    const res = await apiRequest('/auth/login', 'POST', { username, password });
                    if (res.success && res.data) {
                        setStoredUser(res.data, res.data.token);
                        showToast(`Welcome ${res.data.full_name}!`, 'success');
                        setTimeout(() => {
                            window.location.href = res.data.role === 'admin' ? 'dashboard.html' : 'passenger_dashboard.html';
                        }, 700);
                    }
                } catch (err) {
                    alertEl.textContent = err.message || 'Invalid credentials or server unavailable.';
                    alertEl.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Sign In';
                }
            });
        });
    </script>
</body>
</html>
