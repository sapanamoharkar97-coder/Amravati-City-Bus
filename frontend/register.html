<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Registration | Amravati City Bus Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/forms.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary-navy text-white text-center py-4">
                        <i class="fas fa-user-plus fa-3x text-teal mb-2"></i>
                        <h4 class="fw-bold mb-0">Create Passenger Account</h4>
                        <small class="text-light opacity-75">Join the Amravati City Bus Network</small>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="registerForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" id="regUsername" placeholder="e.g. rohit_patil" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="regFullName" placeholder="e.g. Rohit Patil" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="regEmail" placeholder="rohit@example.com" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Mobile Phone (10 digits)</label>
                                    <input type="tel" class="form-control" id="regPhone" placeholder="9823012345" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" id="regGender">
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Age</label>
                                    <input type="number" class="form-control" id="regAge" min="5" max="100" value="23" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Address / Landmark (Amravati)</label>
                                    <input type="text" class="form-control" id="regAddress" placeholder="e.g. Near Rajkamal Square, Amravati">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" id="regPassword" placeholder="Min 6 characters" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="regConfirmPassword" placeholder="Re-enter password" required>
                                </div>
                            </div>

                            <button type="submit" id="btnRegister" class="btn btn-teal w-100 py-2 fs-6 fw-bold mt-4">
                                <i class="fas fa-check-circle me-1"></i> Register Account
                            </button>
                        </form>

                        <div class="mt-4 text-center">
                            <p class="text-muted small mb-0">
                                Already registered? <a href="login.html" class="text-teal fw-bold text-decoration-none">Log in here</a>
                            </p>
                            <p class="text-muted small mt-1">
                                <a href="index.html" class="text-decoration-none">&larr; Return to Homepage</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const alertEl = document.getElementById('registerAlert');
                alertEl.classList.add('d-none');

                const username = document.getElementById('regUsername').value.trim();
                const fullName = document.getElementById('regFullName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const phone = document.getElementById('regPhone').value.trim();
                const gender = document.getElementById('regGender').value;
                const age = parseInt(document.getElementById('regAge').value, 10);
                const address = document.getElementById('regAddress').value.trim();
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('regConfirmPassword').value;

                if (password !== confirmPassword) {
                    alertEl.textContent = 'Passwords do not match.';
                    alertEl.classList.remove('d-none');
                    return;
                }

                if (!FormValidator.isValidPhone(phone)) {
                    alertEl.textContent = 'Please enter a valid 10-digit mobile number.';
                    alertEl.classList.remove('d-none');
                    return;
                }

                const btn = document.getElementById('btnRegister');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Registering...';

                try {
                    const res = await apiRequest('/auth/register', 'POST', {
                        username, full_name: fullName, email, phone,
                        gender, age, address, password
                    });

                    if (res.success && res.data) {
                        setStoredUser(res.data, res.data.token);
                        showToast('Account registered successfully! Welcome aboard.', 'success');
                        setTimeout(() => {
                            window.location.href = 'passenger_dashboard.html';
                        }, 800);
                    }
                } catch (err) {
                    alertEl.textContent = err.message || 'Registration failed.';
                    alertEl.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle me-1"></i> Register Account';
                }
            });
        });
    </script>
</body>
</html>
